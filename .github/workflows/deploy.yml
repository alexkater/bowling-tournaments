name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bowling-production-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: All Checks
    uses: ./.github/workflows/ci.yml

  production-images:
    name: Build Production Images
    needs: [check]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-not-a-production-secret
      JWT_SECRET: ci-only-not-a-production-secret
      NEXT_PUBLIC_API_URL: https://bolos.mogambo.xyz/trpc
      NEXT_PUBLIC_APP_URL: https://bolos.mogambo.xyz
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build production API and web images
        run: docker compose -f docker-compose.prod.yml build api web
