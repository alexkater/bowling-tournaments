name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow reuse from deploy.yml
  workflow_call:

env:
  NODE_VERSION: 20

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Tests (Unit & Integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bowling
          POSTGRES_PASSWORD: bowling
          POSTGRES_DB: bowling
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://bowling:bowling@localhost:5432/bowling
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (shared)
        run: pnpm --filter=@bowling/shared test
      - name: Integration tests (api)
        run: pnpm --filter=@bowling/api test

  infrastructure:
    name: Infrastructure Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test production environment safety
        run: pnpm test:infra
      - name: Shell syntax
        run: bash -n deploy.sh scripts/deploy-server.sh
      - name: Production Compose validation
        env:
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          JWT_SECRET: ci-only-not-a-production-secret
          NEXT_PUBLIC_API_URL: https://bowling.mogambo.xyz/trpc
          NEXT_PUBLIC_APP_URL: https://bowling.mogambo.xyz
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
          images="$(docker compose -f docker-compose.prod.yml config --images)"
          [[ "$images" == *"bowling-tournaments-api:latest"* ]]
          [[ "$images" == *"bowling-tournaments-web:latest"* ]]

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
